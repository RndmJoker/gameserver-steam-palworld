# ============================================================
# Palworld Dedicated Server – Docker Compose Stack
# Official docs: https://docs.palworldgame.com/settings-and-operation/configuration/
#
# This file is self-contained and can be used directly in
# Portainer, Dockhand, or any Docker Compose environment.
# All settings have defaults – adjust only what you need.
#
# For local builds use "build: ." (uncomment below).
# For pre-built images use "image:" (default).
# ============================================================

services:
  palworld:
    # -- Use ONE of the following: --
    # For pre-built image (pull from registry):
    image: ghcr.io/rndmjoker/gameserver-steam-palworld:latest
    # For local build (requires Dockerfile):
    # build: .
    container_name: palworld-server
    restart: unless-stopped
    network_mode: host
    volumes:
      - serverdata:/home/steam/serverdata
      - serverconfig:/home/steam/serverconfig
    # When using bridge networking instead of host mode, uncomment
    # ports and comment out network_mode above:
    # ports:
    #   - "${GAME_PORT:-8211}:${GAME_PORT:-8211}/udp"
    #   - "${RCON_PORT:-25575}:${RCON_PORT:-25575}/tcp"
    mem_limit: ${MEM_LIMIT:-12g}
    environment:
      # ── Docker Infrastructure ─────────────────────────────
      - GAME_PORT=${GAME_PORT:-8211}
      - RCON_PORT=${RCON_PORT:-25575}
      - MEM_LIMIT=${MEM_LIMIT:-12g}
      # - STEAM_LOGIN=anonymous
      # - SKIP_STEAM_UPDATE=false
      # - GAME_ARGS=

      # ── Server Identity ───────────────────────────────────
      - ServerName=${ServerName:-My Palworld Server}
      - ServerDescription=${ServerDescription:-}
      - ServerPassword=${ServerPassword:-}
      - AdminPassword=${AdminPassword:-changeme}
      - ServerPlayerMaxNum=${ServerPlayerMaxNum:-32}
      # - PublicIP=
      # - Region=

      # ── RCON and REST API ─────────────────────────────────
      - RCONEnabled=${RCONEnabled:-False}
      # - RESTAPIEnabled=False
      # - RESTAPIPort=8212

      # ── Server Management ────────────────────────────────
      # - bUseAuth=True
      # - BanListURL=https://api.palworldgame.com/api/banlist.txt
      # - bIsUseBackupSaveData=True
      # - bIsShowJoinLeftMessage=True
      # - bAllowClientMod=False
      # - ChatPostLimitPerMinute=10
      # - LogFormatType=Text

      # ── Performance ───────────────────────────────────────
      # - BaseCampMaxNumInGuild=4
      # - BaseCampWorkerMaxNum=15
      # - MaxBuildingLimitNum=0
      # - ServerReplicatePawnCullDistance=15000.000000

      # ── Game Mode ─────────────────────────────────────────
      # - Difficulty=None
      # - bIsMultiplay=False
      # - bIsPvP=False
      # - bHardcore=False
      # - bCharacterRecreateInHardcore=True

      # ── Features ──────────────────────────────────────────
      # - bEnablePlayerToPlayerDamage=False
      # - bEnableFriendlyFire=False
      # - bEnableInvaderEnemy=True
      # - bActiveUNKO=False
      # - bEnableAimAssistPad=True
      # - bEnableAimAssistKeyboard=False
      # - bEnableNonLoginPenalty=True
      # - bEnableFastTravel=True
      # - bEnableFastTravelOnlyBaseCamp=False
      # - bIsStartLocationSelectByMap=True
      # - bExistPlayerAfterLogout=False
      # - bEnableDefenseOtherGuildPlayer=False
      # - bBuildAreaLimit=False
      # - bInvisibleOtherGuildBaseCampAreaFX=False
      # - bShowPlayerList=True
      # - bCanPickupOtherGuildDeathPenaltyDrop=False
      # - bAutoResetGuildNoOnlinePlayers=False
      # - AutoResetGuildTimeNoOnlinePlayers=72.000000

      # ── Randomizer ────────────────────────────────────────
      # - RandomizerType=None
      # - RandomizerSeed=0
      # - bIsRandomizerPalLevelRandom=False

      # ── Stat Enhancement ──────────────────────────────────
      # - bAllowEnhanceStat_Attack=True
